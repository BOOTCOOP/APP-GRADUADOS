name: Build iOS (release, para App Store)

# Se dispara manualmente desde la pestaña Actions de GitHub.
# Archiva la app con Xcode en un runner de macOS y la sube a App Store
# Connect. Todo binario entra por el mismo canal: aparece en la lista de
# builds (lo que la consola muestra como TestFlight) y de ahí se adjunta a
# una versión de la ficha — no hay forma de "subir directo al App Store",
# y la revisión de Apple es obligatoria.
#
# Tildando "submit_for_review" al lanzarlo, al terminar la subida llama al
# workflow "Enviar iOS a revisión (App Store)", que espera a que Apple
# procese el build, crea la versión en la ficha, le carga las novedades de
# fastlane/release-notes.txt y la manda a revisión (con "Publicar al
# aprobarse" no hay que volver a entrar a la consola).
#
# FIRMA MANUAL (no cloud signing): el certificado de distribución y el
# provisioning profile se inyectan como secrets. Se eligió así a
# propósito para NO tener que emitir una API key con rol Admin — con
# firma manual alcanza una key App Manager, que solo puede subir builds
# y no administrar la cuenta. Ver docs/releases-y-actualizaciones.md.
#
# Requiere estos secrets del repo (Settings → Secrets → Actions):
#   IOS_P12_BASE64     — el .p12 (certificado Apple Distribution + clave
#                        privada + intermedio WWDR) en base64
#   IOS_P12_PASSWORD   — contraseña del .p12
#   IOS_PROFILE_BASE64 — el .mobileprovision de App Store en base64
#   ASC_API_KEY_P8     — contenido del AuthKey_XXXXXX.p8 (App Store
#                        Connect → Usuarios y acceso → Integraciones);
#                        rol App Manager alcanza, tanto para subir como para
#                        editar la ficha y enviar a revisión. Admin solo haría
#                        falta para cloud signing, que acá no se usa.
#   ASC_API_KEY_ID     — "ID de clave" de esa key
#   ASC_API_ISSUER_ID  — "ID de emisor" del equipo
#
# Cuando el certificado venza (1 año) hay que regenerarlo y actualizar
# IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROFILE_BASE64. Si además cambia
# el NOMBRE del profile, actualizar PROFILE_NAME acá y
# PROVISIONING_PROFILE_SPECIFIER en el target App del pbxproj (Release).
on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Además de subir, crear la versión en la ficha y mandarla a revisión'
        type: boolean
        default: false
      auto_release:
        description: 'Publicar automáticamente al aprobarse (solo si se manda a revisión)'
        type: boolean
        default: true

env:
  TEAM_ID: 7RARYSNZU9
  BUNDLE_ID: ar.uba.derecho.graduados
  PROFILE_NAME: github-actions

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8 exige Xcode 26+; el runner trae varias versiones instaladas.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web (base nativa)
        run: npm run build:native

      # En macOS, cap sync también corre pod install.
      - name: Capacitor sync
        run: npx cap sync ios

      - name: Importar certificado y provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Faltan IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROFILE_BASE64 (ver comentario al tope de este workflow)"; exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # AGREGAR el llavero a la lista, no reemplazarla: el del sistema
          # tiene los certificados raíz de Apple y hacen falta para la cadena.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Sin esto, codesign abre un diálogo pidiendo permiso y el job cuelga.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null

          # Xcode 16+ lee los profiles de la ruta nueva; dejamos las dos.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$PROFILE_BASE64" | base64 -d > "$d/$PROFILE_NAME.mobileprovision"
          done

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identidades de firma disponibles:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # OJO: la firma NO se pasa por línea de comandos. xcodebuild aplica los
      # build settings del comando a TODOS los targets, y los Pods (Alamofire,
      # Capacitor, etc.) son librerías que no admiten provisioning profile:
      # falla con "<Pod> does not support provisioning profiles". La config de
      # firma vive en el target App del pbxproj (Release: CODE_SIGN_STYLE
      # Manual + PROVISIONING_PROFILE_SPECIFIER github-actions).
      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive

      # method app-store-connect + destination upload: exporta y sube en un
      # solo paso; el build aparece en TestFlight al terminar de procesarse.
      # La API key solo se usa para la subida (firma ya resuelta arriba).
      - name: Export y subida a App Store Connect
        run: |
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ] || [ -z "${{ secrets.ASC_API_KEY_ID }}" ] || [ -z "${{ secrets.ASC_API_ISSUER_ID }}" ]; then
            echo "::error::Faltan los secrets ASC_* (ver comentario al tope de este workflow)"; exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}"

  # Corre en Linux y arranca esperando a que Apple procese el build (5-20 min),
  # así que no se paga runner de macOS por la espera. Si falla acá (ej. se agotó
  # la espera), "Re-run failed jobs" reintenta solo el envío, sin recompilar.
  enviar-a-revision:
    needs: build-ios
    if: ${{ inputs.submit_for_review }}
    uses: ./.github/workflows/submit-ios.yml
    with:
      # fromJSON y no `inputs.auto_release` pelado: encadenar un input booleano
      # de workflow_dispatch a un input booleano de workflow_call falla con
      # "Unexpected value type. Expected boolean, got string". fromJSON lo
      # normaliza y funciona venga como venga.
      auto_release: ${{ fromJSON(inputs.auto_release) }}
    secrets: inherit
