name: Build iOS (release, para App Store)

# Se dispara manualmente desde la pestaña Actions de GitHub.
# Archiva la app con Xcode en un runner de macOS y la sube a App Store
# Connect: el build queda en TestFlight, y desde ahí se asocia a una
# versión nueva de la ficha y se manda a revisión.
#
# FIRMA MANUAL (no cloud signing): el certificado de distribución y el
# provisioning profile se inyectan como secrets. Se eligió así a
# propósito para NO tener que emitir una API key con rol Admin — con
# firma manual alcanza una key App Manager, que solo puede subir builds
# y no administrar la cuenta. Ver docs/releases-y-actualizaciones.md.
#
# Requiere estos secrets del repo (Settings → Secrets → Actions):
#   IOS_P12_BASE64     — el .p12 (certificado Apple Distribution + clave
#                        privada + intermedio WWDR) en base64
#   IOS_P12_PASSWORD   — contraseña del .p12
#   IOS_PROFILE_BASE64 — el .mobileprovision de App Store en base64
#   ASC_API_KEY_P8     — contenido del AuthKey_XXXXXX.p8 (App Store
#                        Connect → Usuarios y acceso → Integraciones);
#                        rol App Manager alcanza: solo se usa para SUBIR.
#   ASC_API_KEY_ID     — "ID de clave" de esa key
#   ASC_API_ISSUER_ID  — "ID de emisor" del equipo
#
# Cuando el certificado venza (1 año) hay que regenerarlo y actualizar
# IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROFILE_BASE64.
on:
  workflow_dispatch:

env:
  TEAM_ID: 7RARYSNZU9
  BUNDLE_ID: ar.uba.derecho.graduados
  PROFILE_NAME: github-actions

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8 exige Xcode 26+; el runner trae varias versiones instaladas.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web (base nativa)
        run: npm run build:native

      # En macOS, cap sync también corre pod install.
      - name: Capacitor sync
        run: npx cap sync ios

      - name: Importar certificado y provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Faltan IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROFILE_BASE64 (ver comentario al tope de este workflow)"; exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # AGREGAR el llavero a la lista, no reemplazarla: el del sistema
          # tiene los certificados raíz de Apple y hacen falta para la cadena.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Sin esto, codesign abre un diálogo pidiendo permiso y el job cuelga.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null

          # Xcode 16+ lee los profiles de la ruta nueva; dejamos las dos.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$PROFILE_BASE64" | base64 -d > "$d/$PROFILE_NAME.mobileprovision"
          done

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identidades de firma disponibles:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      # method app-store-connect + destination upload: exporta y sube en un
      # solo paso; el build aparece en TestFlight al terminar de procesarse.
      # La API key solo se usa para la subida (firma ya resuelta arriba).
      - name: Export y subida a App Store Connect
        run: |
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ] || [ -z "${{ secrets.ASC_API_KEY_ID }}" ] || [ -z "${{ secrets.ASC_API_ISSUER_ID }}" ]; then
            echo "::error::Faltan los secrets ASC_* (ver comentario al tope de este workflow)"; exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}"
